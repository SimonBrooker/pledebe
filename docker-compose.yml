# pledebe — read-only monitoring.
#
# No Docker socket, no write access to Plex data, no repair code path. Every
# mount below is :ro except pledebe's own data directory.
#
# Copy .env.example to .env and set the paths for your install. See
# docs/platforms.md for where the Plex config root lives on Unraid, Synology,
# QNAP, TrueNAS and Windows.

services:
  pledebe:
    # Pin to a version (e.g. :1.0.0) if you would rather upgrade deliberately.
    image: ghcr.io/simonbrooker/pledebe:latest
    container_name: pledebe
    ports:
      - "8080:8080"
    environment:
      # Ownership for pledebe's /data directory. On Unraid, appdata is usually
      # nobody:users, so set PUID=99 and PGID=100 in .env.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # All optional, with their defaults. Set any of them in .env to override.
      SCAN_INTERVAL: ${SCAN_INTERVAL:-15m}
      DEEP_CHECK_HOUR: ${DEEP_CHECK_HOUR:-4}
      # Fine-grained samples. Daily history is rolled up and kept forever
      # (~0.8 MB per year), so this only bounds the 15-minute detail.
      PLEDEBE_RETAIN: ${PLEDEBE_RETAIN:-336h} # 14 days
      TZ: ${TZ:-Etc/UTC}
      # Set only if PLEX_BACKUP is mounted below.
      PLEX_BACKUP_DIR: ${PLEX_BACKUP_DIR:-}

      # Optional HTTP basic auth. Strongly recommended if this port is reachable
      # by anything you do not control: the page exposes filesystem paths and
      # database details, and has a button that makes the server read the whole
      # database. pledebe logs a warning at startup if it listens on all
      # interfaces without credentials.
      PLEDEBE_USER: ${PLEDEBE_USER:-}
      PLEDEBE_PASSWORD: ${PLEDEBE_PASSWORD:-}

      # Set to "docker" to have pledebe copy Plex's SQLite build out of the
      # Plex container itself, instead of you running docker cp by hand. Also
      # uncomment the socket-proxy service at the bottom of this file.
      PLEX_SQLITE_SOURCE: ${PLEX_SQLITE_SOURCE:-mount}
      PLEX_CONTAINER: ${PLEX_CONTAINER:-plex}
      DOCKER_HOST: ${DOCKER_HOST:-}
    volumes:
      # The Plex config root — pledebe scans it for the database and never
      # writes to it.
      - ${PLEX_CONFIG:?set PLEX_CONFIG in .env}:/plexconfig:ro

      # Plex's own SQLite build, WITH its sibling files. Stock sqlite3 cannot
      # substitute: Plex installs custom collations and uses the spellfix1 and
      # rtree extensions.
      #
      # Until automatic acquisition lands, extract it once:
      #   docker cp <plex-container>:/usr/lib/plexmediaserver ./plexbin
      # hotio images keep it at /app/bin/usr/lib/plexmediaserver instead.
      # Not needed when PLEX_SQLITE_SOURCE=docker — comment this line out then.
      - ${PLEX_SQLITE_DIR:-./plexbin}:/plexbin:ro

      # OPTIONAL. PMS records its backup path (ButlerDatabaseBackupPath) in its
      # own mount namespace, which pledebe cannot resolve. Mount the same
      # directory here and set PLEX_BACKUP_DIR=/plexbackups to check freshness.
      # Without it pledebe reports backup status as "unknown" — never as a
      # failure.
      # - ${PLEX_BACKUP:-/dev/null}:/plexbackups:ro

      # pledebe's own history database. The only writable mount.
      - ./data:/data

    restart: unless-stopped

    # Hardening. pledebe needs no privileges beyond reading the mounts and
    # writing /data; anything it could be made to do beyond that is a bug.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
