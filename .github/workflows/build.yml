name: build

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pledebe

jobs:
  # Fast feedback. The developer machine has no Go toolchain, so this is the
  # compile check — it must run before anything slower.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The Linux-only build tag on diskfree_linux.go means a Windows/macOS
      # build takes the fallback path. Check both compile so a developer machine
      # is never blocked by a platform-specific mistake.
      # Every platform we publish, plus the developer machines. 32-bit ARM in
      # particular has different syscall struct widths (Statfs_t.Bsize is int32
      # there, int64 elsewhere) and once broke only in the slow image build.
      - name: Cross-compile check
        run: |
          GOOS=linux   GOARCH=amd64       go build ./...
          GOOS=linux   GOARCH=arm64       go build ./...
          GOOS=linux   GOARCH=arm GOARM=7 go build ./...
          GOOS=windows GOARCH=amd64       go build ./...
          GOOS=darwin  GOARCH=arm64       go build ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n scripts/*.sh
          shellcheck -S warning scripts/*.sh || true   # advisory for now

  # Publishes from the beta branch and from release tags only.
  #
  # main deliberately publishes nothing. It is the promotion target: work is
  # tested on :beta, merged to main, then tagged — so :latest only ever moves
  # when a release is cut, never because something was pushed.
  #
  # Pull requests still build the image (without pushing) so a broken Dockerfile
  # is caught before merge.
  image:
    needs: check
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/beta' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          # Lowercase: GHCR rejects uppercase in image names, but the GitHub
          # owner is "SimonBrooker".
          IMAGE=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          REF="${{ github.ref }}"

          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"

          if [ "${REF#refs/tags/v}" != "$REF" ]; then
            V="${REF#refs/tags/v}"

            case "$V" in
              *-*)
                # A prerelease (v1.2.0-beta.1). Publish ONLY the exact version.
                # Deriving a series from it would give ":1.2.0-beta" and, worse,
                # move :latest — shipping a beta to every user.
                echo "tags=$IMAGE:$V" >> "$GITHUB_OUTPUT"
                ;;
              *)
                # A release. Publish :latest and the version series, so someone
                # pinning :1 follows patch releases without re-reading docs.
                MAJOR="${V%%.*}"
                MINOR="${V%.*}"
                echo "tags=$IMAGE:latest,$IMAGE:$V,$IMAGE:$MINOR,$IMAGE:$MAJOR" >> "$GITHUB_OUTPUT"
                ;;
            esac
            echo "version=$V" >> "$GITHUB_OUTPUT"

          elif [ "$REF" = "refs/heads/beta" ]; then
            # Testers follow :beta. The sha tag lets a specific build be pinned
            # or rolled back to while a problem is being chased.
            echo "tags=$IMAGE:beta,$IMAGE:beta-$SHORT" >> "$GITHUB_OUTPUT"
            echo "version=beta-$SHORT" >> "$GITHUB_OUTPUT"

          else
            # Pull request: built to prove the Dockerfile works, never pushed.
            echo "tags=$IMAGE:pr-$SHORT" >> "$GITHUB_OUTPUT"
            echo "version=pr-$SHORT" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
